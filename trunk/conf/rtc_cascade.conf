# RTC Cascade configuration for testing WebRTC Private TCP Protocol
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    
    # WebRTC Private TCP for cascade connections
    private_tcp {
        enabled     on;
        listen      9999;
    }
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
    }
}

